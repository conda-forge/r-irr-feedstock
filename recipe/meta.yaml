{% set version = "0.85" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-irr
  version: "{{ version|replace("-", "_") }}"

source:
  url:
    - {{ cran_mirror }}/src/contrib/irr_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/irr/irr_{{ version }}.tar.gz
  sha256: f32e5a703806c5a48ac95997ee1f4abfe0df47f0c7cecc19a5c35be9908ed42a

build:
  noarch: generic
  number: 0
  rpaths:
    - lib/R/lib/
    - lib/
  missing_dso_whitelist:
    - '*/R.dll'        # [win]
    - '*/Rblas.dll'    # [win]
    - '*/Rlapack.dll'  # [win]

requirements:
  build:
    - {{ posix }}zip               # [win]
    - cross-r-base {{ r_base }}    # [build_platform != target_platform]
  host:
    - r-base
    - r-lpsolve
  run:
    - r-base
    - r-lpsolve

test:
  commands:
    - $R -e "library('irr')"           # [not win]
    - "\"%R%\" -e \"library('irr')\""  # [win]

about:
  home: http://www.r-project.org
  license: GPL-2.0-or-later
  summary: 'Coefficients of Interrater Reliability and Agreement for quantitative, ordinal and nominal data: ICC, Finn-Coefficient, Robinson''A, Kendall''s W, Cohen''s Kappa, ...'
  license_family: GPL2
  license_file:
    - '{{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-2'

extra:
  recipe-maintainers:
    - conda-forge/r
    - nick-youngblut
